[/Script/Engine.InputSettings]
bEnableLegacyInputScales=True
DefaultPlayerInputClass=/Script/Engine.PlayerInput
DefaultInputComponentClass=/Script/Engine.InputComponent

; ---- On foot ----
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="MoveForward",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="MoveForward",Scale=1.000000,Key=Gamepad_LeftY)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="MoveRight",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="MoveRight",Scale=1.000000,Key=Gamepad_LeftX)

; ---- Camera ----
+AxisMappings=(AxisName="Turn",Scale=1.000000,Key=MouseX)
+AxisMappings=(AxisName="LookUp",Scale=-1.000000,Key=MouseY)
+AxisMappings=(AxisName="TurnRate",Scale=1.000000,Key=Gamepad_RightX)
+AxisMappings=(AxisName="LookUpRate",Scale=-1.000000,Key=Gamepad_RightY)
+AxisMappings=(AxisName="CameraZoom",Scale=1.000000,Key=MouseWheelAxis)

; ---- Vehicle ----
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=W)
+AxisMappings=(AxisName="Throttle",Scale=-1.000000,Key=S)
+AxisMappings=(AxisName="Throttle",Scale=1.000000,Key=Gamepad_RightTriggerAxis)
+AxisMappings=(AxisName="Throttle",Scale=-1.000000,Key=Gamepad_LeftTriggerAxis)
+AxisMappings=(AxisName="Steer",Scale=1.000000,Key=D)
+AxisMappings=(AxisName="Steer",Scale=-1.000000,Key=A)
+AxisMappings=(AxisName="Steer",Scale=1.000000,Key=Gamepad_LeftX)
+ActionMappings=(ActionName="Handbrake",Key=SpaceBar)
+ActionMappings=(ActionName="Handbrake",Key=Gamepad_FaceButton_Bottom)

; ---- Actions ----
+ActionMappings=(ActionName="Jump",Key=SpaceBar)
+ActionMappings=(ActionName="Jump",Key=Gamepad_FaceButton_Bottom)
+ActionMappings=(ActionName="Sprint",Key=LeftShift)
+ActionMappings=(ActionName="Sprint",Key=Gamepad_LeftThumbstick)
+ActionMappings=(ActionName="Crouch",Key=LeftControl)
+ActionMappings=(ActionName="Crouch",Key=C)
+ActionMappings=(ActionName="Crouch",Key=Gamepad_RightThumbstick)
+ActionMappings=(ActionName="Interact",Key=E)
+ActionMappings=(ActionName="Interact",Key=Gamepad_FaceButton_Left)
+ActionMappings=(ActionName="Fire",Key=LeftMouseButton)
+ActionMappings=(ActionName="Fire",Key=Gamepad_RightTrigger)
+ActionMappings=(ActionName="Aim",Key=RightMouseButton)
+ActionMappings=(ActionName="Aim",Key=Gamepad_LeftTrigger)
+ActionMappings=(ActionName="Reload",Key=R)
+ActionMappings=(ActionName="Reload",Key=Gamepad_FaceButton_Top)
+ActionMappings=(ActionName="NextWeapon",Key=Q)
+ActionMappings=(ActionName="NextWeapon",Key=Gamepad_RightShoulder)
+ActionMappings=(ActionName="Weapon1",Key=One)
+ActionMappings=(ActionName="Weapon2",Key=Two)
+ActionMappings=(ActionName="Weapon3",Key=Three)
+ActionMappings=(ActionName="Weapon4",Key=Four)
+ActionMappings=(ActionName="QuickSave",Key=F5)
+ActionMappings=(ActionName="QuickLoad",Key=F9)
